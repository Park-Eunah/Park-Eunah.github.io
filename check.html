<section id="main" class="c_m_9 c_6">
    <h2>장보기체크 > 필수 상비 재료</h2>
    <p class="sub-desc">떨어지기 전에 무조건 채워두어야 하는 자취방 필수 냉장고 채우기 목록입니다.</p>
    
    <div class="checklist-container">
        <div class="checklist-group">
            <h3>신선 / 냉장 식품</h3>
            <div class="checklist-item">
                <input type="checkbox" id="item1">
                <label for="item1">달걀 (최소 10구 이상 - 단백질 보충 필수)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item2">
                <label for="item2">두부 (찌개용/부침용 만능 재료)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item3">
                <label for="item3">대파 (다져서 냉동 보관용)</label>
            </div>
        </div>

        <div class="checklist-group">
            <h3>소스 / 가공 식품</h3>
            <div class="checklist-item">
                <input type="checkbox" id="item4">
                <label for="item4">캔참치 / 스팸 (유통기한 걱정 없는 비상식량)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item5">
                <label for="item5">진간장 / 양조간장 (요리 초보 필수 베이스 소스)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item6">
                <label for="item6">굴소스 (어떤 볶음 요리든 살려내는 마법 소스)</label>
            </div>
        </div>
    </div>
</section>
